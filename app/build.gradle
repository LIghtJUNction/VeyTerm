plugins {
    id "com.android.application"
}

apply plugin: "org.jetbrains.kotlin.android"

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Supported values are: [ "pacman-android-7" "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "pacman-android-7" // Default: "pacman-android-7"
    def abiArchitectures = ["arm64-v8a": "aarch64", "armeabi-v7a": "arm", "x86": "i686", "x86_64": "x86_64"]
    def debugAbi = project.findProperty("veytermDebugAbi")?.toString()
    if (debugAbi != null && (!abiArchitectures.containsKey(debugAbi) ||
        gradle.startParameter.taskNames.any { it.contains("Release") })) {
        throw new GradleException("veytermDebugAbi selects one supported ABI for local debug builds only")
    }
    nativeAbis = debugAbi != null ? [debugAbi] : abiArchitectures.keySet().toList()
    bootstrapArchitectures = nativeAbis.collect { abiArchitectures[it] }
    if (debugAbi != null) {
        gradle.taskGraph.whenReady { graph ->
            if (graph.allTasks.any { it.project == project && it.name.contains("Release") }) {
                throw new GradleException("Release builds must include and verify all four ABIs")
            }
        }
    }
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        // JADX's embedded API metadata uses ApiStatus.Internal, absent from Kotlin's old transitive annotations.
        implementation "org.jetbrains:annotations:23.0.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        // Shared startup/socket cleanup needs MoreFiles, which the Android artifact omits.
        implementation "com.google.guava:guava:27.1-jre"
        implementation 'net.lingala.zip4j:zip4j:2.11.6'
        implementation 'org.apache.commons:commons-compress:1.28.0'
        implementation 'org.tukaani:xz:1.12'
        implementation 'commons-io:commons-io:2.22.0'
        implementation 'org.apache.commons:commons-lang3:3.21.0'
        implementation 'commons-codec:commons-codec:1.19.0'
        implementation 'org.slf4j:slf4j-api:2.0.17'
        runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
        implementation 'com.github.mwiede:jsch:2.28.8'
        implementation 'commons-net:commons-net:3.13.0'
        implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
        implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'org.smali:dexlib2:2.5.2'
        implementation 'org.smali:baksmali:2.5.2'
        implementation('org.smali:smali:2.5.2') {
            exclude group: 'org.antlr', module: 'antlr'
            exclude group: 'org.antlr', module: 'stringtemplate'
        }
        implementation 'org.antlr:antlr-runtime:3.5.2'
        implementation 'com.android.tools.build:apksig:8.13.2'
        implementation 'com.github.topjohnwu.libsu:core:6.0.0'
        implementation 'com.github.topjohnwu.libsu:service:6.0.0'
        implementation 'dev.rikka.shizuku:api:13.1.5'
        implementation 'dev.rikka.shizuku:provider:13.1.5'
        ['jadx-core', 'jadx-input-api', 'jadx-zip', 'jadx-dex-input'].each { artifact ->
            implementation("io.github.skylot:${artifact}:1.5.6@jar") { transitive = false }
        }
        implementation('com.google.code.gson:gson:2.14.0@jar') { transitive = false }
        ['smali-baksmali', 'smali-dexlib2', 'smali-util'].each { artifact ->
            implementation("com.android.tools.smali:${artifact}:3.0.9@jar") { transitive = false }
        }
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "com.veyterm"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 118
        versionName "0.118.0"
        multiDexEnabled true
        testInstrumentationRunner 'com.termux.app.files.FileWorkspaceSmoke'

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.veyterm"
        manifestPlaceholders.TERMUX_APP_NAME = "VeyTerm"
        manifestPlaceholders.TERMUX_API_APP_NAME = "VeyTerm:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "VeyTerm:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "VeyTerm:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "VeyTerm:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "VeyTerm:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "VeyTerm:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
                abiFilters(*project.ext.nativeAbis)
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include(*project.ext.nativeAbis)
                universalApk(project.ext.nativeAbis.size() > 1)
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    sourceSets {
        // These desktop harnesses start protocol servers or execute generated Java fixtures.
        // Their pinned standalone runners supply the JDK modules and generated sources.
        test.java.exclude 'com/termux/app/files/remote/RemoteRoundTripChecks.java',
            'com/termux/app/files/decompile/ExportedJavaTest.java'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            ["x86", "x86_64", "armeabi-v7a", "arm64-v8a"].findAll { !project.ext.nativeAbis.contains(it) }.each {
                excludes.add("**/${it}/*.so")
            }
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/versions/**']
            merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'LICENSE', 'NOTICE']
            // Both relocated Smali implementations carry a CLI-only version file.
            pickFirsts += ['baksmali.properties']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("veyterm-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("veyterm-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
        aidl true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
}

// ARSCLib includes host-only Android and XML-pull stubs; the APK uses platform classes.
configurations { apkArscSource }
dependencies { apkArscSource('io.github.reandroid:ARSCLib:1.4.0') { transitive = false } }
def apkArscAndroidJar = tasks.register('apkArscAndroidJar', Jar) {
    archiveFileName.set('ARSCLib-1.4.0-android.jar')
    destinationDirectory.set(layout.buildDirectory.dir('apk-tools-deps'))
    from { zipTree(configurations.apkArscSource.singleFile) }
    exclude 'android/**', 'org/xmlpull/**'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
dependencies { implementation files(apkArscAndroidJar.flatMap { it.archiveFile }) }

def prepareArchiveSources = tasks.register('prepareArchiveSources', Exec) {
    description = 'Verify and prepare the pinned libarchive RAR decoder sources.'
    workingDir rootProject.projectDir
    commandLine 'python3', file('src/main/cpp/veyterm-archive/prepare.py').absolutePath
    inputs.files(fileTree('src/main/cpp/veyterm-archive') { exclude 'build/**' })
    outputs.dir('src/main/cpp/veyterm-archive/build/source')
}
def unrarDir = file('src/main/cpp/veyterm-unrar')
def unrarNative = layout.buildDirectory.dir('generated/unrar/jniLibs')
def unrarNotices = layout.buildDirectory.dir('generated/unrar/assets')
def prepareUnrarCommand = tasks.register('prepareUnrarCommand', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', new File(unrarDir, 'prepare.py').absolutePath
    inputs.files(['prepare.py', 'sources.txt', 'LICENSE.UnRAR', 'ACKNOWLEDGEMENTS.UnRAR'].collect { new File(unrarDir, it) })
    outputs.dir(new File(unrarDir, 'build/source'))
}
def buildUnrarCommand = tasks.register('buildUnrarCommand', Exec) {
    dependsOn prepareUnrarCommand
    workingDir rootProject.projectDir
    commandLine(['python3', new File(unrarDir, 'build-android.py').absolutePath, '--ndk',
        new File(android.sdkDirectory, "ndk/${android.ndkVersion}").absolutePath, '--abis'] + project.ext.nativeAbis)
    inputs.files(fileTree(unrarDir) { exclude 'build/android/**' })
    inputs.property('abis', project.ext.nativeAbis)
    outputs.files(project.ext.nativeAbis.collect { new File(unrarDir, "build/android/${it}/libveyterm_unrar.so") })
}
def stageUnrarCommand = tasks.register('stageUnrarCommand', Sync) {
    dependsOn buildUnrarCommand
    project.ext.nativeAbis.each { abi ->
        from(new File(unrarDir, "build/android/${abi}")) { include 'libveyterm_unrar.so'; into abi }
    }
    into unrarNative
}
def stageUnrarNotices = tasks.register('stageUnrarNotices', Sync) {
    from(unrarDir) { include 'LICENSE.UnRAR', 'ACKNOWLEDGEMENTS.UnRAR', 'LICENSE.guard', 'NOTICE.NDK-r30-*' }
    into unrarNotices.map { it.dir('licenses/veyterm-unrar') }
}
android.sourceSets.main.jniLibs.srcDir(unrarNative)
android.sourceSets.main.assets.srcDir(unrarNotices)
tasks.named('preBuild').configure { dependsOn stageUnrarCommand, stageUnrarNotices }
tasks.configureEach {
    if (name.matches('merge.*NativeLibs')) dependsOn stageUnrarCommand
    if (name.matches('merge.*Assets')) dependsOn stageUnrarNotices
}
tasks.configureEach { task ->
    if (task.name == 'preBuild' || task.name.startsWith('configureNdkBuild') || task.name.startsWith('buildNdkBuild'))
        task.dependsOn prepareArchiveSources
}

def archiveJvmRuntime = tasks.register('prepareArchiveJvmRuntime', Exec) {
    dependsOn prepareArchiveSources, prepareUnrarCommand
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('tools/prepare_archive_test_runtime.py').absolutePath,
        layout.buildDirectory.dir('archive-jvm').get().asFile.absolutePath
    inputs.files(fileTree('src/main/cpp/veyterm-archive') { exclude 'build/**' },
        fileTree('src/main/cpp/veyterm-unrar') { exclude 'build/**' },
        fileTree('src/test/java/com/termux/app/files/archive/fixtures'), file('src/test/java/com/termux/app/files/archive/command-fixture.c'),
        rootProject.file('tools/prepare_archive_test_runtime.py'))
    outputs.dir(layout.buildDirectory.dir('archive-jvm'))
}
def unavailableRarTest = tasks.register('verifyRarUnavailable', Test) {
    def normalTests = tasks.named('testDebugUnitTest', Test).get()
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    testClassesDirs = normalTests.testClassesDirs
    classpath = normalTests.classpath
    include '**/RarUnavailableTest.class'
    systemProperty 'java.library.path', layout.buildDirectory.dir('archive-jvm/no-native').get().asFile.absolutePath
    maxHeapSize = '256m'
}
def fullRarTest = tasks.register('verifyFullRarCommand', Test) {
    def normalTests = tasks.named('testDebugUnitTest', Test).get()
    dependsOn 'compileDebugUnitTestJavaWithJavac', archiveJvmRuntime
    testClassesDirs = normalTests.testClassesDirs
    classpath = normalTests.classpath
    include '**/FullRarTest.class'
    systemProperty 'java.library.path', layout.buildDirectory.dir('archive-jvm/no-native').get().asFile.absolutePath
    systemProperty 'veyterm.rar.fixtures', layout.buildDirectory.dir('archive-jvm/fixtures').get().asFile.absolutePath
    systemProperty 'veyterm.rar.command', layout.buildDirectory.file('archive-jvm/unrar/libveyterm_unrar.so').get().asFile.absolutePath
    systemProperty 'veyterm.rar.commandFixture', layout.buildDirectory.file('archive-jvm/command-fixture').get().asFile.absolutePath
    maxHeapSize = '256m'
}
def rarDeviceFixtures = layout.buildDirectory.dir('rar-device/fixtures')
def prepareRarDeviceFixtures = tasks.register('prepareRarDeviceFixtures', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('tools/prepare_archive_test_runtime.py').absolutePath,
        layout.buildDirectory.dir('rar-device').get().asFile.absolutePath, '--fixtures-only'
    inputs.files(fileTree('src/test/java/com/termux/app/files/archive/fixtures'), rootProject.file('tools/prepare_archive_test_runtime.py'))
    outputs.dir(rarDeviceFixtures)
}
android.sourceSets.androidTest.assets.srcDir(rarDeviceFixtures)
android.sourceSets.test.java.srcDir('src/sharedTest/java')
android.sourceSets.androidTest.java.srcDir('src/sharedTest/java')
tasks.configureEach { if (name.matches('merge.*AndroidTestAssets')) dependsOn prepareRarDeviceFixtures }
tasks.withType(Test).configureEach { unit ->
    if (unit.name.startsWith('test') && unit.name.endsWith('UnitTest')) {
        dependsOn archiveJvmRuntime
        exclude '**/RarUnavailableTest.class'
        exclude '**/FullRarTest.class'
        systemProperty 'java.library.path', layout.buildDirectory.dir('archive-jvm/native').get().asFile.absolutePath
        systemProperty 'veyterm.rar.fixtures', layout.buildDirectory.dir('archive-jvm/fixtures').get().asFile.absolutePath
        maxHeapSize = '512m'
        if (unit.name == 'testDebugUnitTest') finalizedBy unavailableRarTest, fullRarTest
    }
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    if (!project.ext.bootstrapArchitectures.contains(arch)) return
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
        }
    }

    def bootstrapBaseUrl = System.getenv("VEYTERM_BOOTSTRAP_BASE_URL") ?: "https://github.com/LIghtJUNction/VeyTerm/releases/download/" + version
    def remoteUrl = bootstrapBaseUrl + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

task downloadBootstraps() {
    doLast {
        def packageVariant = project.ext.packageVariant
        if (packageVariant == "apt-android-7") {
            def version = System.getenv("VEYTERM_BOOTSTRAP_VERSION") ?: "bootstrap-veyterm-0.1.0"
            downloadBootstrap("aarch64", "9951eabae8b5acf65c4fc3e418f69207171ab97b1cb54c7b576214782d5678d6", version)
            downloadBootstrap("arm", "0ac40cda79ece308944c4f0fca848c64cb17d2146978662b8c1ae8a74e585791", version)
            downloadBootstrap("i686", "f4102e4a892bd0962e5d6b6e50e23027b017dc14cf4f0b1a33350c0956215807", version)
            downloadBootstrap("x86_64", "163ecccc6b18d384d32a81a334774dc313004883ee027bf5e7c14d7345494c8c", version)
        } else if (packageVariant == "apt-android-5") {
            def version = "2022.04.28-r6" + "+" + packageVariant
            downloadBootstrap("aarch64", "913609d439415c828c5640be1b0561467e539cb1c7080662decaaca2fb4820e7", version)
            downloadBootstrap("arm", "26bfb45304c946170db69108e5eb6e3641aad751406ce106c80df80cad2eccf8", version)
            downloadBootstrap("i686", "46dcfeb5eef67ba765498db9fe4c50dc4690805139aa0dd141a9d8ee0693cd27", version)
            downloadBootstrap("x86_64", "615b590679ee6cd885b7fd2ff9473c845e920f9b422f790bb158c63fe42b8481", version)
        } else if (packageVariant == "pacman-android-7") {
            def version = System.getenv("VEYTERM_BOOTSTRAP_VERSION") ?: "veyterm-native-20261026-ui2"
            // All four archives contain packages built for the private app
            // prefix. Only the public repository key is shipped; each device
            // creates its own local pacman trust state on first startup.
            downloadBootstrap("aarch64", "65a18d149b19d1a2b6baddbaa0fb55b44857ac15a250b382aac53b4cd57c260b", version)
            downloadBootstrap("arm", "1da76eb46f91c396d59c2249c44d8ae768a8b36b2ca8487441743b20f03e5faf", version)
            downloadBootstrap("i686", "00373c33068a70f23d5d86a392af061a5c475c76bd060bc432072ee27bb9be33", version)
            downloadBootstrap("x86_64", "80b340781ddaeeddf4ddd84376213a882609ebac782fb42418432d7aeca844bd", version)
        } else {
            throw new GradleException("Unsupported TERMUX_PACKAGE_VARIANT \"" + packageVariant + "\"")
        }
    }
}

tasks.register("verifyBootstraps", Exec) {
    group = "verification"
    description = "Reject native bootstraps containing upstream runtime paths or placeholder executables."
    dependsOn(downloadBootstraps)
    onlyIf { project.ext.packageVariant == "pacman-android-7" }
    def python = System.getenv("VEYTERM_PYTHON") ?: (System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3")
    commandLine([python, rootProject.file("tools/verify_bootstrap.py").absolutePath] +
        project.ext.bootstrapArchitectures.collect { file("src/main/cpp/bootstrap-${it}.zip").absolutePath })
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(tasks.named("verifyBootstraps"))
        def apkFiles = variant.outputs.collect { file("$buildDir/outputs/apk/${variant.dirName}/${it.outputFileName}") }
        def prepareApk = tasks.register("prepare${variant.name.capitalize()}BootstrapApk") {
            dependsOn(tasks.named("verifyBootstraps"))
            inputs.files(project.ext.bootstrapArchitectures.collect { file("src/main/cpp/bootstrap-${it}.zip") })
            inputs.files(file("src/main/cpp/termux-bootstrap.c"), file("src/main/cpp/termux-bootstrap-zip.S"), file("src/main/cpp/Android.mk"))
            def stamp = file("$buildDir/intermediates/bootstrap-apk/${variant.name}.stamp")
            outputs.file(stamp)
            doLast {
                // Incremental ZIP updates can retain the previous 100 MB blob as
                // unused space. Missing outputs make AGP package a compact APK.
                apkFiles.each { delete(it) }
                stamp.parentFile.mkdirs()
                stamp.text = "native bootstrap packaging refreshed\n"
            }
        }
        variant.packageApplicationProvider.configure { dependsOn(prepareApk) }
        def apkCheck = tasks.register("verify${variant.name.capitalize()}ApkBootstraps", Exec) {
            group = "verification"
            dependsOn(variant.packageApplicationProvider)
            def python = System.getenv("VEYTERM_PYTHON") ?: (System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3")
            commandLine([python, rootProject.file("tools/verify_apk_bootstrap.py").absolutePath,
                "--bootstrap-directory", file("src/main/cpp").absolutePath] + apkFiles.collect { it.absolutePath })
        }
        variant.assembleProvider.configure { dependsOn(apkCheck) }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("configureNdkBuild") || task.name.startsWith("buildNdkBuild")) {
        task.dependsOn(tasks.named("verifyBootstraps"))
        task.inputs.files(project.ext.bootstrapArchitectures.collect { file("src/main/cpp/bootstrap-${it}.zip") })
    }
}

// Rust is opt-in until release builders provision cargo-ndk and all four
// Android standard-library targets. The default APK remains ndk-build-only;
// enabling this flag packages the versioned Rust JNI probe as well.
def rustCoreEnabled = (System.getenv("VEYTERM_BUILD_RUST_CORE") ?: "0") == "1" ||
    project.findProperty("veytermRustCore")?.toString() == "true"
def rustCoreDirectory = file("../rust-core")
def rustCoreJniLibsDirectory = file("$buildDir/generated/rust/jniLibs")

tasks.register("buildRustCore", Exec) {
    group = "build"
    description = "Build the optional Rust core JNI library for all release ABIs."
    workingDir rustCoreDirectory

    def sdkDirectory = android.sdkDirectory
    def ndkDirectory = new File(sdkDirectory, "ndk/" + android.ndkVersion)
    environment "ANDROID_HOME", sdkDirectory.absolutePath
    environment "ANDROID_SDK_ROOT", sdkDirectory.absolutePath
    environment "ANDROID_NDK_HOME", ndkDirectory.absolutePath
    environment "ANDROID_NDK_ROOT", ndkDirectory.absolutePath

    commandLine "cargo", "ndk",
        "-t", "arm64-v8a",
        "-t", "armeabi-v7a",
        "-t", "x86",
        "-t", "x86_64",
        "-o", rustCoreJniLibsDirectory.absolutePath,
        "build", "--release", "--locked"

    inputs.file(file("$rustCoreDirectory/Cargo.toml"))
    inputs.file(file("$rustCoreDirectory/Cargo.lock"))
    inputs.dir(file("$rustCoreDirectory/src"))
    outputs.dir(rustCoreJniLibsDirectory)
}

if (rustCoreEnabled) {
    android.sourceSets.main.jniLibs.srcDir(rustCoreJniLibsDirectory)
    tasks.named("preBuild").configure { dependsOn(tasks.named("buildRustCore")) }
}
